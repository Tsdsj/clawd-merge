<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="合成大Clawd：把相同的像素小 Clawd 合成更大的 Clawd！" />
    <meta name="theme-color" content="#1a1b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="合成大Clawd" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>合成大Clawd · Clawd Merge</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="title-row">
          <span class="player-chip hidden" id="player-chip"></span>
          <h1 class="title">合成大Clawd</h1>
          <button id="rank-btn" class="icon-btn rank-btn hidden" aria-label="排行榜" title="排行榜">
            <svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true">
              <path
                fill="currentColor"
                d="M2 1h8v1H2zM3 2h6v4H3zM1 2h1v2H1zM10 2h1v2h-1zM2 4h1v1H2zM9 4h1v1H9zM4 6h4v1H4zM5 7h2v1H5zM3 8h6v1H3zM2 9h8v2H2z"
              />
            </svg>
          </button>
        </div>
        <div class="hud">
          <div class="score-box">
            <div class="score-line"><span class="score-label">分数: </span><span id="score">0</span></div>
            <div class="best">最高 <span id="best">0</span></div>
          </div>
          <div class="next-box">
            <span>下一个</span>
            <canvas id="next"></canvas>
          </div>
          <div class="actions">
            <button id="claw" class="icon-btn claw-btn" aria-label="钳子：夹走一只 Clawd" title="钳子 (C)" disabled>
              <svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M5 0h2v2H5zM3 2h6v1H3zM2 3h2v1H2zM8 3h2v1H8zM1 4h2v1H1zM9 4h2v1H9zM1 5h1v2H1zM10 5h1v2h-1zM2 7h2v1H2zM8 7h2v1H8z"
                />
              </svg>
              <span class="badge" id="claw-count">0</span>
            </button>
            <button id="sound" class="icon-btn" aria-label="音效开关">
              <svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true">
                <path fill="currentColor" d="M1 4h2v4H1zM3 3h1v6H3zM4 2h1v8H4zM5 1h1v10H5z" />
                <path class="waves" fill="currentColor" d="M7 4h1v4H7zM9 2h1v8H9z" />
                <path
                  class="mute"
                  fill="currentColor"
                  d="M7 4h1v1H7zM8 5h1v1H8zM9 6h1v1H9zM10 7h1v1h-1zM10 4h1v1h-1zM9 5h1v1H9zM8 6h1v1H8zM7 7h1v1H7z"
                />
              </svg>
            </button>
            <button id="restart" class="btn">重新开始</button>
          </div>
        </div>
      </header>

      <section class="stage" id="stage">
        <div class="board" id="board">
          <canvas id="game"></canvas>
          <div class="overlay hidden" id="overlay">
            <div class="panel">
              <div class="over-title">游戏结束!</div>
              <div class="final">最终分数: <b id="final">0</b></div>
              <div class="final-sub">最高合成: <span id="final-level">小Clawd</span></div>
              <div class="final-sub">历史最高: <span id="final-best">0</span></div>
              <div class="new-best hidden" id="new-best">✦ 新纪录 ✦</div>
              <div class="final-rank hidden" id="final-rank"></div>
              <div class="panel-actions">
                <button id="again" class="btn big">再来一局</button>
                <button id="over-rank" class="btn big ghost hidden">排行榜</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="legend" id="legend"></footer>
    </main>

    <div class="modal hidden" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-title">
      <form class="sheet" id="name-form" autocomplete="off" novalidate>
        <canvas id="name-crab"></canvas>
        <h2 id="name-title">给自己起个名字</h2>
        <p class="sheet-sub">名字会出现在排行榜上，并和这个浏览器绑定</p>
        <input id="name-input" maxlength="12" placeholder="2~12 个字" enterkeyhint="go" spellcheck="false" />
        <p class="hint">中文、英文、数字或 _ - · ，不能和别人重名</p>
        <p class="error" id="name-error" role="alert"></p>
        <button class="btn big" id="name-submit" type="submit">开始游戏</button>
        <button class="link-btn hidden" id="name-offline" type="button">先离线玩（成绩不上榜）</button>
      </form>
    </div>

    <div class="modal hidden" id="rank-modal" role="dialog" aria-modal="true" aria-labelledby="rank-title">
      <div class="sheet rank-sheet">
        <div class="sheet-head">
          <h2 id="rank-title">排行榜</h2>
          <button class="icon-btn" id="rank-close" aria-label="关闭">✕</button>
        </div>
        <ol class="rank-list" id="rank-list"></ol>
        <div class="rank-me hidden" id="rank-me"></div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
