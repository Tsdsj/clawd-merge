<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>特殊 Clawd · 本地验收</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:dark;font-family:"PingFang SC",system-ui,sans-serif;color:#f6efe6;background:#12121b}*{box-sizing:border-box}body{margin:0;padding:28px 20px}main{max-width:980px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:23px;margin:0 0 8px}p{color:#b6b1c6;font-size:14px;line-height:1.7;margin:0}a{color:#edc0a2;text-underline-offset:4px}.layout{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:26px}.stage{align-self:start;width:100%;max-width:min(400px,calc((100svh - 200px)*.625));min-width:260px;margin-inline:auto;border:1px solid #444051;border-radius:14px;overflow:hidden;background:#1c1b29;position:relative}#board{display:block;width:100%;aspect-ratio:400/640;touch-action:manipulation}.preview{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #393544;min-height:60px;font-size:13px}.preview strong{font-size:20px}.next{display:flex;align-items:center;gap:12px;color:#b6b1c6}.scenes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}button{font:inherit;font-size:14px;min-height:44px;border:1px solid #51495d;border-radius:8px;color:#ece8f3;background:#282432;cursor:pointer;padding:10px 12px}button:hover{background:#373044}button[aria-pressed=true]{background:#48364e;border-color:#c394dc}button:focus-visible,a:focus-visible{outline:2px solid #f2ce76;outline-offset:3px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{flex:1}.status{min-height:96px;background:#201d2b;border-left:3px solid #c394dc;padding:12px 14px;margin:16px 0;color:#ede5f5;line-height:1.7;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.card{background:#201d2b;border:1px solid #393144;border-radius:10px;text-align:center;padding:14px 5px}.card canvas{image-rendering:pixelated;max-width:80px;min-height:40px;object-fit:contain}.card h2{font-size:13px;margin:8px 0 0}.card p{font-size:11px;margin-top:5px}.muted{font-size:12px;color:#9891a6}.motion{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:13px;color:#c5bed1}input{width:18px;height:18px;accent-color:#c394dc}footer{margin-top:20px;padding-top:15px;border-top:1px solid #373140}summary{cursor:pointer;color:#bdb2ce;font-size:13px;padding:8px 0}.elapsed{font-variant-numeric:tabular-nums;color:#c5bed1;font-size:12px;margin-top:10px}@media(max-width:680px){body{padding:16px 12px}header{align-items:flex-start}h1{font-size:19px}header a{font-size:12px;white-space:nowrap}.layout{grid-template-columns:1fr;gap:16px}.panel{display:contents}.intro{grid-row:1}.stage{grid-row:2;max-width:400px;width:100%;margin:auto}.details{grid-row:3}.scenes{grid-template-columns:repeat(3,1fr);margin:12px 0 0}.scenes button{font-size:12px;padding:8px 4px}.status{min-height:70px;margin-top:12px}.cards{margin:15px 0}}
</style>
</head>
<body><main>
<header><div><h1>特殊 Clawd · 本地验收</h1><p>选一个场景，看看它如何改变棋盘。</p></div><a href="/">进入正常游戏 ↗</a></header>
<div class="layout">
<section class="stage" aria-label="场景棋盘"><div class="preview"><div>分数 <strong id="score">0</strong></div><div class="next">下一个 <canvas id="next" role="img" aria-label="下一只 Clawd"></canvas></div></div><canvas id="board" width="400" height="640" aria-label="特殊机制演示棋盘"></canvas></section>
<section class="panel">
<div class="intro"><p id="description"></p><div class="scenes" aria-label="真实堆叠场景">
<button data-scene="pile-pull" aria-pressed="true">堆叠 · 磁力有效</button><button data-scene="pile-control" aria-pressed="false">同堆 · 普通对照</button><button data-scene="pile-blocked" aria-pressed="false">堆叠 · 目标受阻</button><button data-scene="pile-consumed" aria-pressed="false">堆叠 · 提前消耗</button><button data-scene="pile-empty" aria-pressed="false">堆叠 · 无同级</button>
</div><details><summary>基础机制场景</summary><div class="scenes" aria-label="基础机制场景">
<button data-scene="gold" aria-pressed="true">金色 ×2</button><button data-scene="magnet" aria-pressed="false">磁力吸附</button><button data-scene="freeze" aria-pressed="false">冰冻抗撞</button><button data-scene="freeze-merge" aria-pressed="false">冻结中合成</button><button data-scene="barrier" aria-pressed="false">磁力与障碍</button><button data-scene="expiry" aria-pressed="false">磁力耗尽</button>
</div></details></div>
<div class="details"><div id="status" class="status" role="status" aria-live="polite">点击场景开始。</div><div class="controls"><button id="replay">重播</button><button id="pause" aria-pressed="true">开始</button><button id="sound">音效：开</button></div><label class="motion"><input id="reduced" type="checkbox">减弱动效</label><div class="elapsed">场景时间 <output id="elapsed">0.0</output> 秒</div>
<div class="cards"><div class="card"><canvas data-icon="gold"></canvas><h2>金色 Clawd</h2><p>菱形 · 原色不变</p></div><div class="card"><canvas data-icon="magnet"></canvas><h2>磁力 Clawd</h2><p>磁极 · 原色不变</p></div><div class="card"><canvas data-icon="freeze"></canvas><h2>冰冻 Clawd</h2><p>冰晶 · 原色不变</p></div></div>
<footer><p class="muted">配件可附着在原来的 1–5 级，合成仍看基础等级。上方三个图标都是 3级咖啡示例。场景使用真实物理，不上传成绩。首次点击后才能播放声音；切到后台会暂停。</p></footer></div>
</section></div>
</main><script type="module" src="./classic2-lab.js"></script></body></html>
