name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      - run: npm test
      - run: npm run test:http
  d1:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
      # Isolated test runtime only; the game/Worker retain zero dependencies.
      - run: npm install --prefix "$RUNNER_TEMP/d1-runtime" --no-audit --no-fund --save-exact miniflare@5.20260911.0-alpha
      - run: npm run test:d1
        env:
          MINIFLARE_MODULE: ${{ runner.temp }}/d1-runtime/node_modules/miniflare
