name = "clawd-merge-leaderboard"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Origins allowed to call the API (comma separated).
ALLOWED_ORIGINS = "https://tsdsj.github.io,http://localhost:5173"
# Extra banned words for names, comma separated (reserved words are built in).
BLOCKED_WORDS = ""

[[d1_databases]]
binding = "DB"
database_name = "clawd-merge"
# Replace with the id printed by `npx wrangler d1 create clawd-merge`.
database_id = "9684a750-0039-4e4b-8fff-7f492dc945fd"
