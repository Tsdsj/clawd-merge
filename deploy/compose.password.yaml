# Optional release overlay. Enable only after the password acceptance gate.
# Create the keyring privately before including this file in Compose commands.
services:
  api:
    environment:
      PASSWORD_AUTH_ENABLED: '1'
      PASSWORD_AUTH_KEYRING_FILE: /run/secrets/password_keyring
      PASSWORD_AUTH_CONCURRENCY: ${PASSWORD_AUTH_CONCURRENCY:-2}
    secrets: [password_keyring]
secrets:
  password_keyring:
    file: ${CLAWD_SECRET_DIR:-./secrets}/password-keyring.json
