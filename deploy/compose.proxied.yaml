# Optional overlay: run clawd behind a host reverse proxy that terminates TLS.
# Enable with: docker compose -f compose.yaml -f compose.proxied.yaml ...
# (or COMPOSE_FILE=compose.yaml:compose.proxied.yaml in the private .env).
# Without this overlay nothing changes: web keeps publishing 80/443 and certbot keeps renewing.
services:
  web:
    # Replace (not append) the public 80/443 bindings: only the host proxy can reach nginx now.
    ports: !override
      - '127.0.0.1:${WEB_PROXY_PORT:-8080}:80'
    volumes:
      # Same mount target as compose.yaml, so this replaces the HTTPS template.
      - ${CLAWD_DEPLOY_DIR:-.}/nginx-proxied.conf:/opt/clawd/nginx.conf.template:ro
  certbot:
    # The host proxy issues and renews certificates; keep certbot available for rollback only.
    profiles: [standalone-tls]
