user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  sendfile on;
  server_tokens off;
  client_max_body_size 16k;
  client_body_timeout 15s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { return 200 'ok'; }
    location / { return 308 https://${PUBLIC_HOST}$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_HOST};
    ssl_certificate /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream$request_uri;
      proxy_set_header Host ${PUBLIC_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header CF-Connecting-IP '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
      proxy_buffering off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
  }
}
