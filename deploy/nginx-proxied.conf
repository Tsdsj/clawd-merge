user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /dev/stdout safe;
  sendfile on;
  server_tokens off;
  client_max_body_size 16k;
  client_body_timeout 15s;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # TLS ends at the host proxy, which overwrites X-Real-IP with the visitor address
  # (taken from CF-Connecting-IP only when the connection came from Cloudflare).
  # Trust it only from the Docker bridge / loopback, i.e. from the host proxy itself.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  server {
    listen 80 default_server;
    server_name ${PUBLIC_HOST};
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { return 200 'ok'; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream$request_uri;
      proxy_set_header Host ${PUBLIC_HOST};
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header CF-Connecting-IP '';
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_send_timeout 20s;
      proxy_buffering off;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
  }
}
